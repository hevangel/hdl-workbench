name: LUNA-09 browser integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install wasm build dependency
        run: sudo apt-get update && sudo apt-get install --yes clang

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build browser Xezim WASM assets
        run: |
          cargo build --release --manifest-path crates/xezim-web/Cargo.toml --target wasm32-unknown-unknown
          mkdir -p apps/ide/public/wasm
          wasm-bindgen --target web --out-dir apps/ide/public/wasm \
            crates/xezim-web/target/wasm32-unknown-unknown/release/xezim_web.wasm

      - name: Build and test workspace
        run: |
          pnpm build
          pnpm test

      - name: Install Playwright Chromium and system dependencies
        run: pnpm --filter @xezim-ide/mcp-bridge exec playwright install --with-deps chromium

      - name: Run browser integration acceptance test
        run: pnpm test:e2e
        env:
          CI: true
