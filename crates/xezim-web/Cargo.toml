[package]
name = "xezim-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
xezim = { path = "../../vendor/xezim", default-features = false }
fst-writer = "0.3"

# The browser has no filesystem, so the patched copy accepts any seekable writer.
# See vendor/UPSTREAM.md.
[patch.crates-io]
fst-writer = { path = "../../vendor/fst-writer" }
