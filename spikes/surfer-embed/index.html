<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfer LUNA-00B protocol smoke</title>
    <style>
      html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr 10rem; }
      header { padding: .5rem 1rem; background: #18202a; color: white; }
      #surfer { width: 100%; height: 100%; border: 0; }
      pre { margin: 0; overflow: auto; padding: .5rem 1rem; background: #101318; color: #c8dfc8; }
      .warn { color: #ffc46b; }
    </style>
  </head>
  <body>
    <header>
      <strong>Surfer browser smoke</strong>
      <span id="status">starting</span>
      <span class="warn">Hosted app is unpinned; this page is diagnostic only.</span>
    </header>
    <iframe id="surfer" title="Surfer waveform viewer" src="https://app.surfer-project.org/"></iframe>
    <pre id="log" aria-live="polite"></pre>
    <script type="module">
      const frame = document.querySelector('#surfer');
      const log = document.querySelector('#log');
      const status = document.querySelector('#status');
      const fixture = new URL('./fixture-counter.vcd', location.href).href;
      const messages = [];
      const record = (label, data = '') => {
        const line = new Date().toISOString() + ' ' + label + (data ? ' ' + data : '');
        messages.push(line);
        log.textContent = messages.join('\n');
      };

      record('browser', navigator.userAgent);
      record('frame-load-url', frame.src);
      frame.addEventListener('load', () => {
        status.textContent = 'frame document loaded; waiting for Surfer WASM';
        record('frame-document-load');

        // Pinned source has no documented parent-page readiness callback.
        // This delay is diagnostic only and is not a production readiness API.
        setTimeout(() => {
          frame.contentWindow.postMessage({ command: 'LoadUrl', url: fixture }, '*');
          record('sent LoadUrl', fixture);
        }, 8000);

        setTimeout(() => {
          const addVariables = {
            AddVariables: [{
              path: { strs: ['top'], id: 'None' },
              name: 'count',
              id: 'None',
              index: null,
            }],
          };
          frame.contentWindow.postMessage({
            command: 'InjectMessage',
            message: JSON.stringify(addVariables),
          }, '*');
          record('sent InjectMessage/AddVariables', JSON.stringify(addVariables));
        }, 11000);

        setTimeout(() => {
          // num-bigint Serde JSON shape: (Sign, BigUint little-endian u32 digits).
          const cursorSet = { CursorSet: [1, [25]] };
          frame.contentWindow.postMessage({
            command: 'InjectMessage',
            message: JSON.stringify(cursorSet),
          }, '*');
          record('sent InjectMessage/CursorSet', JSON.stringify(cursorSet));
          status.textContent = 'messages sent; inspect waveform and browser logs';
        }, 14000);
      }, { once: true });
    </script>
  </body>
</html>
