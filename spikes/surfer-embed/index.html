<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surfer LUNA-00B same-origin integration smoke</title>
    <style>
      html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr 9rem; }
      header { display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem; background: #18202a; color: white; }
      #surferFrame { width: 100%; height: 100%; border: 0; }
      #log { margin: 0; overflow: auto; padding: .5rem 1rem; background: #101318; color: #c8dfc8; white-space: pre-wrap; }
      button { padding: .3rem .6rem; }
    </style>
  </head>
  <body>
    <header>
      <strong>Surfer same-origin browser smoke</strong>
      <span id="status" data-ready="false">waiting for pinned WASM</span>
      <button id="loadFixture" type="button">Load fixture</button>
      <button id="loadBlob" type="button">Load fixture Blob URL</button>
      <button id="addSignal" type="button">Add top.count</button>
      <button id="setCursor" type="button">Set cursor to 25 ns</button>
    </header>
    <iframe id="surferFrame" title="Pinned Surfer waveform viewer" src="/assets/surfer/index.html"></iframe>
    <pre id="log" aria-live="polite"></pre>
    <script type="module">
      const frame = document.querySelector('#surferFrame');
      const status = document.querySelector('#status');
      const log = document.querySelector('#log');
      const fixture = new URL('/fixture-counter.vcd', location.href).href;
      const events = [];
      const record = (event, detail = '') => {
        const item = { time: new Date().toISOString(), event, detail };
        events.push(item);
        log.textContent = events.map((entry) => `${entry.time} ${entry.event}${entry.detail ? ` ${entry.detail}` : ''}`).join('\n');
        window.__surferTestEvents = events;
      };
      const send = (payload) => {
        frame.contentWindow.postMessage(payload, location.origin);
        record('sent', JSON.stringify(payload));
      };

      window.__surferTestEvents = events;
      window.__surferFrame = frame;
      window.__surferFixture = fixture;
      window.__sendSurferMessage = send;

      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
        if (event.data?.type === 'surfer-ready') {
          status.textContent = 'pinned viewer ready';
          status.dataset.ready = 'true';
          record('viewer-ready', JSON.stringify(event.data));
        }
      });

      document.querySelector('#loadFixture').addEventListener('click', () => {
        send({ command: 'LoadUrl', url: fixture });
      });
      document.querySelector('#loadBlob').addEventListener('click', async () => {
        const response = await fetch(fixture);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        record('created-blob-url', blobUrl);
        send({ command: 'LoadUrl', url: blobUrl });
      });
      document.querySelector('#addSignal').addEventListener('click', () => {
        const addVariables = {
          AddVariables: [{
            path: { strs: ['top'], id: 'None' },
            name: 'count',
            id: 'None',
            index: null,
          }],
        };
        send({ command: 'InjectMessage', message: JSON.stringify(addVariables) });
      });
      document.querySelector('#setCursor').addEventListener('click', () => {
        const cursorSet = { CursorSet: [1, [25]] };
        send({ command: 'InjectMessage', message: JSON.stringify(cursorSet) });
      });

      record('browser', navigator.userAgent);
      record('fixture-url', fixture);
    </script>
  </body>
</html>
